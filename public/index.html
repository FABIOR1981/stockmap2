<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockMap · Depósito</title>
  <style>
    :root {
      --fondo: #eceff3;
      --superficie: #fbfcfd;
      --tinta: #14202b;
      --tinta-suave: #4f5c69;
      --linea: #d8dfe6;
      --linea-fuerte: #bcc7d2;
      --acento: #1f5f5b;
      --acento-hover: #174a47;
      --acento-suave: #e2eeed;
      --foco: rgba(31, 95, 91, 0.28);
      --peligro: #a4262c;
      --peligro-suave: #f8e7e6;
      --aviso-fondo: #f7efd9;
      --aviso-tinta: #5c4206;
      --radio: 10px;
      --radio-chico: 8px;
    }

    * { box-sizing: border-box; }
    ::selection { background: var(--acento-suave); color: var(--tinta); }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background: var(--fondo);
      color: var(--tinta);
      -webkit-font-smoothing: antialiased;
    }

    .oculto { display: none !important; }

    /* ---------- Cabecera ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--superficie);
      border-bottom: 1px solid var(--linea);
      padding: 0 20px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .marca {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }
    .marca svg { width: 22px; height: 22px; }
    .sesion { display: flex; align-items: center; gap: 12px; }

    /* ---------- Estructura de la app: menú + contenido ---------- */
    .app {
      display: grid;
      grid-template-columns: 1fr;
      min-height: calc(100vh - 60px);
    }
    @media (min-width: 760px) {
      .app { grid-template-columns: 220px 1fr; }
    }

    .menu {
      background: var(--superficie);
      border-bottom: 1px solid var(--linea);
      padding: 8px 12px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    @media (min-width: 760px) {
      .menu {
        flex-direction: column;
        border-bottom: none;
        border-right: 1px solid var(--linea);
        padding: 20px 14px;
      }
    }
    .menu button {
      background: transparent;
      color: var(--tinta-suave);
      text-align: left;
      font-weight: 600;
      height: 40px;
      padding: 0 12px;
      white-space: nowrap;
      width: auto;
    }
    @media (min-width: 760px) {
      .menu button { width: 100%; }
    }
    .menu button:hover:not(:disabled) { background: #e9eef3; color: var(--tinta); }
    .menu button[aria-current="page"] { background: var(--acento-suave); color: var(--acento); }
    .menu .auxiliar {
      border: 1px dashed var(--linea-fuerte);
      color: var(--tinta-suave);
      background: transparent;
    }
    @media (min-width: 760px) {
      .menu .auxiliar { margin-top: auto; }
    }

    .contenido {
      padding: 28px 24px 56px;
      width: 100%;
      max-width: 1100px;
    }

    /* ---------- Vistas ---------- */
    .cabecera-vista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .cabecera-vista h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .barra-cliente { margin-bottom: 20px; max-width: 360px; }

    .aviso {
      background: var(--aviso-fondo);
      color: var(--aviso-tinta);
      border: 1px solid #ead7a4;
      border-radius: var(--radio-chico);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.92rem;
    }

    /* ---------- Tarjetas y paneles ---------- */
    .card {
      background: var(--superficie);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    /* ---------- Formularios ---------- */
    .campos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px 16px;
    }
    .campo { display: flex; flex-direction: column; min-width: 0; }
    .campo.ancho { grid-column: 1 / -1; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--tinta-suave);
      margin-bottom: 6px;
    }

    input, select {
      font: inherit;
      color: var(--tinta);
      background: #fff;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--linea-fuerte);
      border-radius: var(--radio-chico);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder { color: #8a867c; }
    input:hover, select:hover { border-color: #9aa8b6; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px var(--foco);
    }

    .acciones {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ---------- Botones ---------- */
    button {
      font: inherit;
      font-weight: 600;
      height: 40px;
      padding: 0 16px;
      border-radius: var(--radio-chico);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--foco); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .primario { background: var(--acento); color: #fff; }
    .primario:hover:not(:disabled) { background: var(--acento-hover); }
    .primario:active:not(:disabled) { background: #123a38; }

    .secundario {
      background: var(--superficie);
      color: var(--tinta);
      border-color: var(--linea-fuerte);
    }
    .secundario:hover:not(:disabled) { background: #e9eef3; border-color: #9aa8b6; }

    .peligro {
      background: transparent;
      color: var(--peligro);
      height: 32px;
      padding: 0 10px;
      font-size: 0.88rem;
    }
    .peligro:hover:not(:disabled) { background: var(--peligro-suave); }

    .ancho-completo { width: 100%; }

    /* ---------- Tabla ---------- */
    .tabla-wrap {
      background: var(--superficie);
      border: 1px solid var(--linea);
      border-radius: var(--radio);
      padding: 8px;
      overflow-x: auto;
    }
    .tabla-wrap table { border-radius: 6px; overflow: hidden; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 12px 20px;
      border-bottom: 1px solid var(--linea);
      vertical-align: middle;
      white-space: nowrap;
    }
    thead th {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--tinta-suave);
      background: #f4f7f9;
      border-bottom-color: var(--linea-fuerte);
    }
    tbody tr:hover td { background: #f6f9fb; }
    tbody tr:last-child td { border-bottom: none; }
    td strong { font-weight: 650; font-variant-numeric: tabular-nums; }
    td:last-child, th:last-child { text-align: right; width: 1%; }
    td[colspan] {
      text-align: center;
      width: auto;
      color: var(--tinta-suave);
      padding: 28px 20px;
      white-space: normal;
    }

    /* ---------- Etiquetas y errores ---------- */
    .etiqueta {
      display: inline-block;
      background: var(--acento-suave);
      color: var(--acento);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .error {
      color: var(--peligro);
      background: var(--peligro-suave);
      border-radius: var(--radio-chico);
      padding: 10px 12px;
      margin: 14px 0 0;
      font-size: 0.9rem;
    }

    /* ---------- Login ---------- */
    #vista-login { min-height: 100vh; }
    main.login {
      max-width: 380px;
      margin: 12vh auto 0;
      padding: 0 20px;
    }
    .login-titulo {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .login-sub {
      margin: 0 0 20px;
      color: var(--tinta-suave);
      font-size: 0.92rem;
    }
    #form-login label { margin-top: 14px; }
    #form-login label:first-of-type { margin-top: 0; }
    #form-login .primario { margin-top: 20px; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- Pantalla de login -->
  <section id="vista-login" class="oculto">
    <main class="login">
      <div class="card">
        <div class="marca" style="margin-bottom:22px">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1f5f5b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="5" rx="1"/>
            <rect x="3" y="11" width="8" height="9" rx="1"/>
            <rect x="13" y="11" width="8" height="9" rx="1"/>
          </svg>
          StockMap
        </div>
        <h2 class="login-titulo">Ingresar</h2>
        <p class="login-sub">Usá tu email y contraseña para entrar.</p>
        <form id="form-login">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username" />
          <label for="password">Contraseña</label>
          <input id="password" type="password" required autocomplete="current-password" />
          <button type="submit" class="primario ancho-completo">Entrar</button>
        </form>
        <p id="error-login" class="error oculto"></p>
      </div>
    </main>
  </section>

  <!-- Aplicación principal -->
  <section id="vista-app" class="oculto">
    <header>
      <div class="marca">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1f5f5b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="5" rx="1"/>
          <rect x="3" y="11" width="8" height="9" rx="1"/>
          <rect x="13" y="11" width="8" height="9" rx="1"/>
        </svg>
        StockMap
      </div>
      <div class="sesion">
        <span id="usuario-actual" class="etiqueta"></span>
        <button id="btn-salir" class="secundario">Salir</button>
      </div>
    </header>

    <div class="app">
      <!-- Menú de secciones -->
      <nav class="menu" aria-label="Secciones">
        <button type="button" data-vista="contenedores" aria-current="page">Contenedores</button>
        <button type="button" data-vista="ubicaciones">Ubicaciones</button>
        <!-- Solo para desarrollo: quitar antes de usar con clientes reales -->
        <button type="button" id="btn-datos-prueba" class="auxiliar">Cargar datos de prueba</button>
      </nav>

      <div class="contenido">
        <div id="aviso" class="aviso oculto"></div>

        <!-- Selector de cliente: solo visible para el admin general -->
        <div id="bloque-cliente" class="oculto barra-cliente">
          <label for="selector-cliente">Cliente</label>
          <select id="selector-cliente"></select>
        </div>

        <!-- Vista: contenedores -->
        <section id="vista-contenedores" class="vista">
          <div class="cabecera-vista">
            <h1>Contenedores</h1>
            <button type="button" class="primario" data-alternar="panel-contenedor">Nuevo contenedor</button>
          </div>

          <div id="panel-contenedor" class="card oculto">
            <h2>Nuevo contenedor</h2>
            <form id="form-contenedor">
              <div class="campos">
                <div class="campo">
                  <label for="codigo">Código / etiqueta</label>
                  <input id="codigo" required />
                </div>
                <div class="campo">
                  <label for="tipo">Tipo</label>
                  <select id="tipo"></select>
                </div>
                <div class="campo">
                  <label for="ubicacion">Ubicación</label>
                  <select id="ubicacion"></select>
                </div>
                <div class="campo ancho">
                  <label for="descripcion">Descripción corta (sin detallar el contenido)</label>
                  <input id="descripcion" maxlength="120" />
                </div>
              </div>
              <div class="acciones">
                <button type="button" class="secundario" data-cerrar="panel-contenedor">Cancelar</button>
                <button type="submit" class="primario">Guardar contenedor</button>
              </div>
            </form>
          </div>

          <div class="tabla-wrap">
            <table>
              <thead><tr><th>Código</th><th>Tipo</th><th>Ubicación</th><th>Descripción</th><th></th></tr></thead>
              <tbody id="tabla-contenedores"></tbody>
            </table>
          </div>
        </section>

        <!-- Vista: ubicaciones -->
        <section id="vista-ubicaciones" class="vista oculto">
          <div class="cabecera-vista">
            <h1>Ubicaciones</h1>
            <button type="button" class="primario" data-alternar="panel-ubicacion">Nueva ubicación</button>
          </div>

          <div id="panel-ubicacion" class="card oculto">
            <h2>Nueva ubicación</h2>
            <form id="form-ubicacion">
              <div class="campos">
                <div class="campo"><label for="pasillo">Pasillo</label><input id="pasillo" required /></div>
                <div class="campo"><label for="estante">Estante</label><input id="estante" required /></div>
                <div class="campo"><label for="nivel">Nivel</label><input id="nivel" required /></div>
              </div>
              <div class="acciones">
                <button type="button" class="secundario" data-cerrar="panel-ubicacion">Cancelar</button>
                <button type="submit" class="primario">Guardar ubicación</button>
              </div>
            </form>
          </div>

          <div class="tabla-wrap">
            <table>
              <thead><tr><th>Pasillo</th><th>Estante</th><th>Nivel</th><th></th></tr></thead>
              <tbody id="tabla-ubicaciones"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </section>

  <script src="persistencia.js"></script>
  <script src="app.js"></script>
</body>
</html>
